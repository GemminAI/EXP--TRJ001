[project]
name = "exp-trj001"
version = "0.0.1"
description = "EXP-2026-NVS-001: kappa-based hallucination detection and Neural ODE post-processing on 64D semantic trajectories (pre-registered, plan v1.3)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "httpx>=0.27",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
